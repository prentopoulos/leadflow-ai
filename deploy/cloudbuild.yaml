# LeadFlow AI release build. Submitted source-less from Cloud Shell:
#
#   gcloud builds submit --no-source --region=northamerica-northeast2 \
#     --config=deploy/cloudbuild.yaml \
#     --substitutions=_COMMIT_SHA=<40-char sha>
#
# It clones the public repository, verifies the exact clean commit, builds the
# digest-pinned Dockerfile, and pushes one immutable image. Logs go to Cloud
# Logging only, so no Cloud Storage bucket is used; if a build ever reports a
# bucket, stop (docs/operations/runbook.md, "Build").
substitutions:
  _REPOSITORY_URL: https://github.com/prentopoulos/leadflow-ai.git
  _REGION: northamerica-northeast2
  _AR_REPOSITORY: leadflow-ai-demo
  _IMAGE: app
  _COMMIT_SHA: ''

options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
  substitutionOption: MUST_MATCH

steps:
  - id: clone-and-verify
    name: gcr.io/cloud-builders/git
    entrypoint: bash
    args:
      - -euo
      - pipefail
      - -c
      - |
        [[ "${_COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "A full commit SHA is required."; exit 1; }
        git clone --no-checkout "${_REPOSITORY_URL}" source
        cd source
        git checkout --detach "${_COMMIT_SHA}"
        [ "$(git rev-parse HEAD)" = "${_COMMIT_SHA}" ] || { echo "Cloned revision differs."; exit 1; }
        [ -z "$(git status --porcelain --untracked-files=all)" ] || { echo "Clone is not clean."; exit 1; }
        git log -1 --format='Building %H (%cI)'

  - id: build
    name: gcr.io/cloud-builders/docker
    dir: source
    args:
      - build
      - --build-arg
      - SOURCE_COMMIT=${_COMMIT_SHA}
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE}:${_COMMIT_SHA}
      - .

# Pushing through `images` records the resolved digest in the build result;
# deployment always uses that digest, never this commit tag.
images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE}:${_COMMIT_SHA}
