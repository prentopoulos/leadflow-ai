<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hosted-lifecycle-title hosted-lifecycle-desc" id="hosted-lifecycle-root">
  <title id="hosted-lifecycle-title">Hosted retention and teardown</title>
  <desc id="hosted-lifecycle-desc">Every hosted document carries a Timestamp expiresAt seven days ahead; a Firestore TTL policy per collection group removes expired documents eventually, usually within a further 24 hours, and an owner-confirmed purge limited to the exact project and database can remove synthetic data at once. After the owner approves the evidence, the service, data, access and non-final images are removed by day 7, the final image and repository by day 30, and the empty Toronto database and sanitized repository evidence remain; after day 30 the release is rebuilt rather than rolled back.</desc>
  <defs>
      <style>#hosted-lifecycle-root { --color-paper: #f4f1e9;
      --color-ink: #1a211f;
      --color-muted: #626a66;
      --color-accent: #075e57;
      --font-sans: Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;
      --font-serif: 'Instrument Serif', Georgia, 'Times New Roman', serif;
      --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace; }
      #hosted-lifecycle-root { font-family: var(--font-sans); color: var(--color-ink); }
      #hosted-lifecycle-root .diagram-container { width: 100%; overflow-x: auto; }
      #hosted-lifecycle-root .intro { color: var(--color-muted); max-width: 60ch; margin-bottom: 1.5rem; line-height: 1.5; }
      @media print {
#hosted-lifecycle-root .diagram-container { overflow-x: visible; }
}</style>
