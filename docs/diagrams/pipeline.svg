<?xml version="1.0" encoding="UTF-8"?>
<svg width="1120" height="420" viewBox="0 0 1120 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipeline-title pipeline-desc" id="pipeline-root">
  <title id="pipeline-title">From form to a human-reviewed draft</title>
  <desc id="pipeline-desc">A fictional form submission is stored first, reduced to selected facts, scored and checked against public sources, used to prepare a draft, verified and placed in the dashboard for human review and manual use.</desc>
  <defs>
      <style>#pipeline-root { --color-paper: #f4f1e9;
      --color-ink: #1a211f;
      --color-muted: #626a66;
      --color-accent: #075e57;
      --font-sans: Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;
      --font-serif: 'Instrument Serif', Georgia, 'Times New Roman', serif;
      --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace; }
      #pipeline-root { font-family: var(--font-sans); color: var(--color-ink); }
      #pipeline-root .diagram-container { width: 100%; overflow-x: auto; }
      #pipeline-root .intro { color: var(--color-muted); max-width: 60ch; margin-bottom: 1.5rem; line-height: 1.5; }
      @media print {
#pipeline-root .diagram-container { overflow-x: visible; }
}</style>
      <marker id="pipeline-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#626a66"/></marker>
      <marker id="pipeline-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#075e57"/></marker>
      <marker id="pipeline-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3a5a85"/></marker>
  </defs>
