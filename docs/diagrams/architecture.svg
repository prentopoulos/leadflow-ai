<svg viewBox="0 0 960 592" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
  <title id="architecture-title">LeadFlow AI local architecture</title>
  <desc id="architecture-desc">An operator uses the dossier, which calls a loopback Fastify API; the API commits intake to the Firestore Emulator before the LangGraph runtime scores it with domain contracts, while model, enrichment, cloud and Auth services stay deferred outside the workstation boundary.</desc>
