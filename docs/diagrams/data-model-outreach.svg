<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="data-model-outreach-title data-model-outreach-desc" id="data-model-outreach-root">
  <title id="data-model-outreach-title">Enrichment, draft and review records</title>
  <desc id="data-model-outreach-desc">A run links up to two enrichment evidence records, one email check, one run-level verification result and one draft whose immutable revisions each carry a content digest, their own verification result and at most one append-only human review.</desc>
  <defs>
      <style>#data-model-outreach-root { --color-paper: #f4f1e9;
      --color-ink: #1a211f;
      --color-muted: #626a66;
      --color-accent: #075e57;
      --font-sans: Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;
      --font-serif: 'Instrument Serif', Georgia, 'Times New Roman', serif;
      --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace; }
      #data-model-outreach-root { font-family: var(--font-sans); color: var(--color-ink); }
      #data-model-outreach-root .diagram-container { width: 100%; overflow-x: auto; }
      #data-model-outreach-root .intro { color: var(--color-muted); max-width: 60ch; margin-bottom: 1.5rem; line-height: 1.5; }
      @media print {
#data-model-outreach-root .diagram-container { overflow-x: visible; }
}</style>
