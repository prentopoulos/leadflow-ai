<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 448" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agent-architecture-title agent-architecture-desc" id="agent-architecture-root">
  <title id="agent-architecture-title">Orchestrator and specialist agents</title>
  <desc id="agent-architecture-desc">After the intake API commits a lead, a LangGraph orchestrator dispatches in order to a qualification agent, an enrichment agent that calls NHTSA vPIC and Zippopotam.us read-only, an outreach agent that writes a consent-gated template draft and, when switched on, adds a cited paragraph from a capped Anthropic research and drafting team, and a verifier guard; it checkpoints each step in Firestore, sends a passing draft to human review, and resumes a stopped run from its checkpoint.</desc>
  <defs>
      <style>#agent-architecture-root { --color-paper: #f4f1e9;
      --color-ink: #1a211f;
      --color-muted: #626a66;
      --color-accent: #075e57;
      --font-sans: Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;
      --font-serif: 'Instrument Serif', Georgia, 'Times New Roman', serif;
      --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace; }
      #agent-architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #agent-architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      #agent-architecture-root .intro { color: var(--color-muted); max-width: 60ch; margin-bottom: 1.5rem; line-height: 1.5; }
      @media print {
#agent-architecture-root .diagram-container { overflow-x: visible; }
}</style>
