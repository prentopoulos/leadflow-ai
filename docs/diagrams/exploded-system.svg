<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 612" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="exploded-system-title exploded-system-desc" id="exploded-system-root">
  <title id="exploded-system-title">What makes one LeadFlow run</title>
  <desc id="exploded-system-desc">Exploded axonometric view of four LeadFlow AI layers: stored evidence at the base, deterministic scoring consent and verification controls, a bounded qualification enrichment drafting workflow, and the operator workspace for intake runs and review.</desc>
  <defs>
      <style>#exploded-system-root { --color-paper: #f4f1e9;
      --color-ink: #1a211f;
      --color-muted: #626a66;
      --color-accent: #075e57;
      --font-sans: Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;
      --font-serif: 'Instrument Serif', Georgia, 'Times New Roman', serif;
      --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace; }
      #exploded-system-root { font-family: var(--font-sans); color: var(--color-ink); }
      #exploded-system-root .diagram-container { width: 100%; overflow-x: auto; }
      #exploded-system-root .intro { color: var(--color-muted); max-width: 60ch; margin-bottom: 1.5rem; line-height: 1.5; }
      @media print {
#exploded-system-root .diagram-container { overflow-x: visible; }
}</style>
