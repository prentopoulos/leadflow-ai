<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agent-team-title agent-team-desc" id="agent-team-root">
  <title id="agent-team-title">Research and drafting agent team</title>
  <desc id="agent-team-desc">Inside the compose step, a Sonnet 5.5 lead plans questions, three Haiku 5.5 workers search the web in parallel, code keeps only claims whose quoted source carries their numbers and words, the lead merges kept claims into a brief, a Sonnet 5.5 writer drafts one cited paragraph that a code rule checker and a Sonnet 5.5 critic review with at most two rewrites, and the approved paragraph joins the template draft that the eight verification rules check before human review.</desc>
  <defs>
      <style>#agent-team-root { --color-paper: #f4f1e9;
      --color-ink: #1a211f;
      --color-muted: #626a66;
      --color-accent: #075e57;
      --font-sans: Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;
      --font-serif: 'Instrument Serif', Georgia, 'Times New Roman', serif;
      --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace; }
      #agent-team-root { font-family: var(--font-sans); color: var(--color-ink); }
      #agent-team-root .diagram-container { width: 100%; overflow-x: auto; }
      #agent-team-root .intro { color: var(--color-muted); max-width: 60ch; margin-bottom: 1.5rem; line-height: 1.5; }
      @media print {
#agent-team-root .diagram-container { overflow-x: visible; }
}</style>
