<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 496" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="security-trifecta-title security-trifecta-desc" id="security-trifecta-root">
  <title id="security-trifecta-title">No run gets all three capabilities</title>
  <desc id="security-trifecta-desc">Three overlapping capability sets show bounded untrusted input, sensitive data and a way out. Their shared center is blocked. The matrix shows recorded local, live local and optional agent-local modes without real personal data or automatic sending.</desc>
  <defs>
      <style>#security-trifecta-root { --color-paper: #f4f1e9;
      --color-ink: #1a211f;
      --color-muted: #626a66;
      --color-accent: #075e57;
      --font-sans: Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;
      --font-serif: 'Instrument Serif', Georgia, 'Times New Roman', serif;
      --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace; }
      #security-trifecta-root { font-family: var(--font-sans); color: var(--color-ink); }
      #security-trifecta-root .diagram-container { width: 100%; overflow-x: auto; }
      #security-trifecta-root .intro { color: var(--color-muted); max-width: 60ch; margin-bottom: 1.5rem; line-height: 1.5; }
      @media print {
#security-trifecta-root .diagram-container { overflow-x: visible; }
}</style>
      <marker id="security-trifecta-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#626a66"/></marker>
      <marker id="security-trifecta-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#075e57"/></marker>
      <marker id="security-trifecta-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3a5a85"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f4f1e9"/>
  <text x="40" y="48" fill="#1a211f" font-size="28" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif">No run gets all three capabilities</text>
  <text x="40" y="72" fill="#626a66" font-size="12" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">Current modes accept bounded fictional input without combining it with real personal data and an outbound channel.</text>
  <text x="40" y="116" fill="#626a66" font-size="8" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace" letter-spacing="0.14em">SECURITY TRIFECTA / VENN VIEW</text>
  <circle cx="180" cy="224" r="104" fill="#3a5a85" stroke="#3a5a85" stroke-width="1.2" fill-opacity="0.08"/>
  <circle cx="116" cy="324" r="104" fill="#626a66" stroke="#626a66" stroke-width="1.2" fill-opacity="0.05" stroke-opacity="0.62"/>
  <circle cx="244" cy="324" r="104" fill="#ffffff" stroke="#1a211f" stroke-width="1.2" fill-opacity="0.76"/>
  <text x="180" y="166" fill="#1a211f" font-size="12" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="middle">Untrusted input</text>
  <text x="180" y="183" fill="#626a66" font-size="9" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">bounded fictional leads</text>
  <text x="82" y="352" fill="#1a211f" font-size="12" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="middle">Sensitive data</text>
  <text x="82" y="369" fill="#626a66" font-size="9" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">real data gated</text>
  <text x="278" y="352" fill="#1a211f" font-size="12" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="middle">Way out</text>
  <text x="278" y="369" fill="#626a66" font-size="9" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">approved HTTPS GET</text>
  <circle cx="180" cy="292" r="42" fill="#075e57" stroke="#1a211f" stroke-width="1"/>
  <text x="180" y="288" fill="#ffffff" font-size="12" font-weight="700" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="middle">3 / 3</text>
  <text x="180" y="306" fill="#ffffff" font-size="9" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="middle" letter-spacing="0.1em">BLOCKED</text>
  <rect x="116" y="440" width="128" height="40" rx="6" fill="#ffffff" stroke="#1a211f" stroke-width="1"/>
  <text x="180" y="457" fill="#1a211f" font-size="12" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="middle">No 3 / 3 mode</text>
  <text x="180" y="472" fill="#626a66" font-size="9" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">tools + config + gates</text>
  <rect x="380" y="116" width="580" height="336" rx="8" fill="#ffffff" stroke="#1a211f" stroke-opacity="0.16"/>
  <rect x="380" y="116" width="580" height="64" fill="#1a211f" fill-opacity="0.03"/>
  <line x1="380" y1="180" x2="960" y2="180" stroke="#1a211f" stroke-width="0.8" stroke-opacity="0.16"/>
  <line x1="540" y1="116" x2="540" y2="452" stroke="#1a211f" stroke-width="0.8" stroke-opacity="0.16"/>
  <line x1="660" y1="116" x2="660" y2="452" stroke="#1a211f" stroke-width="0.8" stroke-opacity="0.16"/>
  <line x1="780" y1="116" x2="780" y2="452" stroke="#1a211f" stroke-width="0.8" stroke-opacity="0.16"/>
  <line x1="880" y1="116" x2="880" y2="452" stroke="#1a211f" stroke-width="0.8" stroke-opacity="0.16"/>
  <text x="400" y="153" fill="#626a66" font-size="8" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace" letter-spacing="0.14em">MODE</text>
  <text x="600" y="146" fill="#626a66" font-size="8" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.1em">UNTRUSTED</text>
  <text x="600" y="158" fill="#626a66" font-size="8" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.1em">INPUT</text>
  <text x="720" y="146" fill="#626a66" font-size="8" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.1em">SENSITIVE</text>
  <text x="720" y="158" fill="#626a66" font-size="8" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.1em">DATA</text>
  <text x="830" y="146" fill="#626a66" font-size="8" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.1em">WAY OUT</text>
  <text x="920" y="146" fill="#626a66" font-size="8" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.1em">COUNT</text>
  <line x1="380" y1="248" x2="960" y2="248" stroke="#1a211f" stroke-width="0.8" stroke-opacity="0.16"/>
  <text x="400" y="210" fill="#1a211f" font-size="12" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">Recorded local</text>
  <text x="400" y="226" fill="#626a66" font-size="9" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace">saved evidence</text>
  <text x="600" y="216" fill="#1a211f" font-size="10" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="middle">BOUNDED</text>
  <text x="720" y="216" fill="#626a66" font-size="10" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="middle">ABSENT</text>
  <text x="830" y="216" fill="#626a66" font-size="10" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="middle">NONE</text>
  <text x="920" y="216" fill="#1a211f" font-size="12" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="middle">1 / 3</text>
  <line x1="380" y1="316" x2="960" y2="316" stroke="#1a211f" stroke-width="0.8" stroke-opacity="0.16"/>
  <text x="400" y="278" fill="#1a211f" font-size="12" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">Live local</text>
  <text x="400" y="294" fill="#626a66" font-size="9" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace">public enrichment</text>
  <text x="600" y="284" fill="#1a211f" font-size="10" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="middle">BOUNDED</text>
  <text x="720" y="284" fill="#626a66" font-size="10" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="middle">ABSENT</text>
  <text x="830" y="284" fill="#1a211f" font-size="10" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="middle">HTTPS GET</text>
  <text x="920" y="284" fill="#1a211f" font-size="12" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="middle">2 / 3</text>
  <line x1="380" y1="384" x2="960" y2="384" stroke="#1a211f" stroke-width="0.8" stroke-opacity="0.16"/>
  <text x="400" y="346" fill="#1a211f" font-size="12" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">Agent local</text>
  <text x="400" y="362" fill="#626a66" font-size="9" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace">public web only</text>
  <text x="600" y="352" fill="#1a211f" font-size="10" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="middle">BOUNDED</text>
  <text x="720" y="352" fill="#626a66" font-size="10" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="middle">ABSENT</text>
  <text x="830" y="352" fill="#1a211f" font-size="10" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="middle">SEARCH / READ</text>
  <text x="920" y="352" fill="#1a211f" font-size="12" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="middle">2 / 3</text>
  <rect x="388" y="392" width="564" height="52" rx="4" fill="#075e57" stroke="#075e57" stroke-width="1.2" fill-opacity="0.08"/>
  <text x="404" y="416" fill="#1a211f" font-size="12" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">Rejected configuration</text>
  <text x="404" y="433" fill="#626a66" font-size="9" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace">Lead input + real personal data + model or sender cannot enter a run.</text>
  <text x="914" y="423" fill="#075e57" font-size="8" font-weight="700" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="middle">3 / 3 BLOCKED</text>
</svg>
