<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="run-lifecycle-title run-lifecycle-desc" id="run-lifecycle-root">
  <title id="run-lifecycle-title">Run lifecycle and recovery</title>
  <desc id="run-lifecycle-desc">A persisted run is claimed into running, retries the first transient fault once, records partial then failed_retryable or failed_terminal when a step still fails, completes after finalize, and returns to running only through an expired-lease reclaim or an explicit operator resume of a retryable run.</desc>
  <defs>
      <style>#run-lifecycle-root { --color-paper: #f4f1e9;
      --color-ink: #1a211f;
      --color-muted: #626a66;
      --color-accent: #075e57;
      --font-sans: Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;
      --font-serif: 'Instrument Serif', Georgia, 'Times New Roman', serif;
      --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace; }
      #run-lifecycle-root { font-family: var(--font-sans); color: var(--color-ink); }
      #run-lifecycle-root .diagram-container { width: 100%; overflow-x: auto; }
      #run-lifecycle-root .intro { color: var(--color-muted); max-width: 60ch; margin-bottom: 1.5rem; line-height: 1.5; }
      @media print {
#run-lifecycle-root .diagram-container { overflow-x: visible; }
}</style>
      <marker id="run-lifecycle-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#626a66"/></marker>
