<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="access-matrix-title access-matrix-desc" id="access-matrix-root">
  <title id="access-matrix-title">Access and authority by mode</title>
  <desc id="access-matrix-desc">Security matrix comparing the local operator, the allowlisted hosted owner, another signed-in account and a public unauthenticated request across workspace, API, Firestore, enrichment, draft review, message sending and deployment or purge authority.</desc>
  <defs>
      <style>#access-matrix-root { --color-paper: #f4f1e9;
      --color-ink: #1a211f;
      --color-muted: #626a66;
      --color-accent: #075e57;
      --font-sans: Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;
      --font-serif: 'Instrument Serif', Georgia, 'Times New Roman', serif;
      --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace; }
      #access-matrix-root { font-family: var(--font-sans); color: var(--color-ink); }
      #access-matrix-root .diagram-container { width: 100%; overflow-x: auto; }
      #access-matrix-root .intro { color: var(--color-muted); max-width: 60ch; margin-bottom: 1.5rem; line-height: 1.5; }
      @media print {
#access-matrix-root .diagram-container { overflow-x: visible; }
}</style>
