<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agent-workflow-title agent-workflow-desc" id="agent-workflow-root">
  <title id="agent-workflow-title">How the team builds one paragraph</title>
  <desc id="agent-workflow-desc">A research lead assigns bounded vehicle, area and coverage questions to three workers; code checks every cited claim, the lead merges only kept claims, a writer drafts one paragraph, review allows at most two rewrites, and a person reviews the result.</desc>
  <defs>
      <style>#agent-workflow-root { --color-paper: #f4f1e9;
      --color-ink: #1a211f;
      --color-muted: #626a66;
      --color-accent: #075e57;
      --font-sans: Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;
      --font-serif: 'Instrument Serif', Georgia, 'Times New Roman', serif;
      --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace; }
      #agent-workflow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #agent-workflow-root .diagram-container { width: 100%; overflow-x: auto; }
      #agent-workflow-root .intro { color: var(--color-muted); max-width: 60ch; margin-bottom: 1.5rem; line-height: 1.5; }
      @media print {
#agent-workflow-root .diagram-container { overflow-x: visible; }
}</style>
      <marker id="agent-workflow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#626a66"/></marker>
      <marker id="agent-workflow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#075e57"/></marker>
      <marker id="agent-workflow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3a5a85"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f4f1e9"/>
  <rect x="16" y="104" width="768" height="224" rx="8" fill="#1a211f" stroke="rgba(26,33,31,0.3)" stroke-width="0.8" stroke-dasharray="5,4" fill-opacity="0.02"/>
  <rect x="256" y="108" width="196" height="12" rx="2" fill="#f4f1e9"/>
  <text x="354" y="117" fill="#56605b" font-size="7" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">RESEARCH · PUBLIC WEB · BOUNDED QUESTIONS</text>
  <path d="M184,208 L208,208" fill="none" stroke="#626a66" stroke-width="1.2" marker-end="url(#agent-workflow-arrow)"/>
  <path d="M416,208 L440,208" fill="none" stroke="#626a66" stroke-width="1.2" marker-end="url(#agent-workflow-arrow)"/>
  <path d="M600,208 L624,208" fill="none" stroke="#626a66" stroke-width="1.2" marker-end="url(#agent-workflow-arrow)"/>
  <path d="M784,208 L800,208" fill="none" stroke="#626a66" stroke-width="1.2" marker-end="url(#agent-workflow-arrow)"/>
  <path d="M868,256 L868,336" fill="none" stroke="#626a66" stroke-width="1.2" marker-end="url(#agent-workflow-arrow)"/>
  <path d="M868,432 L868,488" fill="none" stroke="#626a66" stroke-width="1.2" marker-end="url(#agent-workflow-arrow)"/>
  <path d="M800,372 L768,372 Q760,372 760,364 L760,308 Q760,300 768,300 L860,300 Q868,300 868,292 L868,256" fill="none" stroke="#626a66" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#agent-workflow-arrow)"/>
  <rect x="24" y="160" width="160" height="96" rx="6" fill="#f4f1e9"/>
  <rect x="24" y="160" width="160" height="96" rx="6" fill="#ffffff" stroke="#1a211f" stroke-width="1"/>
  <rect x="32" y="166" width="68" height="12" rx="2" fill="none" stroke="#1a211f" stroke-opacity="0.5" stroke-width="0.8"/>
  <text x="66" y="175" fill="#56605b" font-size="7" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">RESEARCH LEAD</text>
  <text x="104" y="192" fill="#1a211f" font-size="12" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="middle">Plan research</text>
  <text x="104" y="207" fill="#626a66" font-size="9" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">1–3 questions per topic</text>
  <text x="104" y="220" fill="#626a66" font-size="9" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">no tools</text>
  <rect x="208" y="136" width="208" height="144" rx="6" fill="#f4f1e9"/>
  <rect x="208" y="136" width="208" height="144" rx="6" fill="#ffffff" stroke="#1a211f" stroke-width="1"/>
  <text x="312" y="172" fill="#1a211f" font-size="14" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="middle">Three workers</text>
  <line x1="224" y1="188" x2="400" y2="188" stroke="rgba(26,33,31,0.14)" stroke-width="0.8"/>
  <text x="312" y="216" fill="#1a211f" font-size="12" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="middle">Vehicle · area · coverage</text>
  <text x="312" y="240" fill="#626a66" font-size="9" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">search in parallel</text>
  <text x="312" y="258" fill="#626a66" font-size="9" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">URL + quote + answer</text>
  <rect x="440" y="160" width="160" height="96" rx="6" fill="#f4f1e9"/>
  <rect x="440" y="160" width="160" height="96" rx="6" fill="#075e57" stroke="#075e57" stroke-width="1" fill-opacity="0.08"/>
  <rect x="448" y="166" width="28" height="12" rx="2" fill="none" stroke="#075e57" stroke-opacity="0.5" stroke-width="0.8"/>
  <text x="462" y="175" fill="#56605b" font-size="7" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CODE</text>
  <text x="520" y="192" fill="#1a211f" font-size="12" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="middle">Check claims</text>
  <text x="520" y="207" fill="#626a66" font-size="9" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">quote carries words</text>
  <text x="520" y="220" fill="#626a66" font-size="9" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">and every number</text>
  <rect x="624" y="160" width="160" height="96" rx="6" fill="#f4f1e9"/>
  <rect x="624" y="160" width="160" height="96" rx="6" fill="#ffffff" stroke="#1a211f" stroke-width="1"/>
  <rect x="632" y="166" width="68" height="12" rx="2" fill="none" stroke="#1a211f" stroke-opacity="0.5" stroke-width="0.8"/>
  <text x="666" y="175" fill="#56605b" font-size="7" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">RESEARCH LEAD</text>
  <text x="704" y="192" fill="#1a211f" font-size="12" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="middle">Merge brief</text>
  <text x="704" y="207" fill="#626a66" font-size="9" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">kept claims only</text>
  <text x="704" y="220" fill="#626a66" font-size="9" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">no new facts</text>
  <rect x="800" y="160" width="136" height="96" rx="6" fill="#f4f1e9"/>
  <rect x="800" y="160" width="136" height="96" rx="6" fill="#ffffff" stroke="#1a211f" stroke-width="1"/>
  <rect x="808" y="166" width="40" height="12" rx="2" fill="none" stroke="#1a211f" stroke-opacity="0.5" stroke-width="0.8"/>
  <text x="828" y="175" fill="#56605b" font-size="7" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">WRITER</text>
  <text x="868" y="192" fill="#1a211f" font-size="12" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="middle">Write paragraph</text>
  <text x="868" y="207" fill="#626a66" font-size="9" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">claim IDs</text>
  <text x="868" y="220" fill="#626a66" font-size="9" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">600 chars max</text>
  <rect x="800" y="336" width="136" height="96" rx="6" fill="#f4f1e9"/>
  <rect x="800" y="336" width="136" height="96" rx="6" fill="#ffffff" stroke="#1a211f" stroke-width="1"/>
  <rect x="808" y="342" width="32" height="12" rx="2" fill="none" stroke="#1a211f" stroke-opacity="0.5" stroke-width="0.8"/>
  <text x="824" y="351" fill="#56605b" font-size="7" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CHECK</text>
  <text x="868" y="368" fill="#1a211f" font-size="12" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="middle">Review draft</text>
  <text x="868" y="383" fill="#626a66" font-size="9" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">rules · critic</text>
  <text x="868" y="396" fill="#626a66" font-size="9" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">≤ 2 rewrites</text>
  <rect x="800" y="488" width="136" height="80" rx="6" fill="#f4f1e9"/>
  <rect x="800" y="488" width="136" height="80" rx="6" fill="#626a66" stroke="#56605b" stroke-width="1" fill-opacity="0.1"/>
  <rect x="808" y="494" width="40" height="12" rx="2" fill="none" stroke="#56605b" stroke-opacity="0.5" stroke-width="0.8"/>
  <text x="828" y="503" fill="#56605b" font-size="7" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">PERSON</text>
  <text x="868" y="520" fill="#1a211f" font-size="12" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="middle">Human review</text>
  <text x="868" y="535" fill="#626a66" font-size="9" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">approve · edit</text>
  <text x="868" y="548" fill="#626a66" font-size="9" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">reject · no send</text>
  <text x="24" y="500" fill="#626a66" font-size="14" font-style="italic" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif">Workers never see name, email, ZIP or request text.</text>
  <text x="24" y="518" fill="#626a66" font-size="14" font-style="italic" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif">Any failure keeps the plain template draft and records the reason.</text>
</svg>
