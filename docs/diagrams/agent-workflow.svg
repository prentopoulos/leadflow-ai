  <path d="M240,244 L720,244" fill="none" stroke="#626a66" stroke-width="1.2"/>
  <path d="M240,244 L240,284" fill="none" stroke="#626a66" stroke-width="1.2" marker-end="url(#agent-workflow-arrow)"/>
  <path d="M480,244 L480,284" fill="none" stroke="#626a66" stroke-width="1.2" marker-end="url(#agent-workflow-arrow)"/>
