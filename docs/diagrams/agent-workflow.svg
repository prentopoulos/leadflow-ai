<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agent-workflow-title agent-workflow-desc" id="agent-workflow-root">
  <title id="agent-workflow-title">Research team, drafting and human review</title>
  <desc id="agent-workflow-desc">One research leader plans questions for three sub-agents, receives their code-checked vehicle, environmental and coverage findings, merges a research brief for a separate drafting agent, and passes the draft through fixed rules, a separate critic agent and human review with at most two rewrites.</desc>
  <defs>
      <style>#agent-workflow-root { --color-paper: #f4f1e9;
      --color-ink: #1a211f;
      --color-muted: #626a66;
      --color-accent: #075e57;
      --font-sans: Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;
      --font-serif: 'Instrument Serif', Georgia, 'Times New Roman', serif;
      --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace; }
      #agent-workflow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #agent-workflow-root .diagram-container { width: 100%; overflow-x: auto; }
      #agent-workflow-root .intro { color: var(--color-muted); max-width: 60ch; margin-bottom: 1.5rem; line-height: 1.5; }
      @media print {
#agent-workflow-root .diagram-container { overflow-x: visible; }
}</style>
