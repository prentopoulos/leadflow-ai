  <text x="480" y="130" fill="#1a211f" font-size="13" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="middle">Research lead</text>
  <text x="480" y="150" fill="#626a66" font-size="9" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">plan · assign · merge</text>
