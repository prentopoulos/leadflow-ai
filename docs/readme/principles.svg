<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 168" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="principles-title principles-desc" id="principles-root">
  <title id="principles-title">LeadFlow AI principles</title>
  <desc id="principles-desc">Three principles: intake is persisted before processing, enrichment comes from public vehicle and ZIP sources with every answer labelled live or recorded, and outreach drafts need recorded consent and human approval and are never sent.</desc>
  <defs>
      <style>#principles-root { --color-paper: #f4f1e9;
      --color-ink: #1a211f;
      --color-muted: #626a66;
      --color-accent: #075e57;
      --font-sans: Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;
      --font-serif: 'Instrument Serif', Georgia, 'Times New Roman', serif;
      --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace; }
      #principles-root { font-family: var(--font-sans); color: var(--color-ink); }
      #principles-root .diagram-container { width: 100%; overflow-x: auto; }
      #principles-root .intro { color: var(--color-muted); max-width: 60ch; margin-bottom: 1.5rem; line-height: 1.5; }
      @media print {
#principles-root .diagram-container { overflow-x: visible; }
}</style>
      <marker id="principles-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#626a66"/></marker>
      <marker id="principles-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#075e57"/></marker>
      <marker id="principles-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3a5a85"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f4f1e9"/>
  <text x="40" y="44" fill="#075e57" font-size="8" font-weight="400" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace" text-anchor="start">01 · INVARIANT</text>
  <text x="40" y="76" fill="#1a211f" font-size="20" font-weight="400" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" text-anchor="start">Persist before processing</text>
  <text x="40" y="104" fill="#626a66" font-size="13" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="start">Intake, lead, run and first event</text>
  <text x="40" y="124" fill="#626a66" font-size="13" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="start">commit before any workflow step.</text>
  <line x1="356" y1="32" x2="356" y2="136" stroke="#1a211f" stroke-width="0.8" stroke-opacity="0.16"/>
  <text x="372" y="44" fill="#56605b" font-size="8" font-weight="400" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace" text-anchor="start">02 · EVIDENCE</text>
  <text x="372" y="76" fill="#1a211f" font-size="20" font-weight="400" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" text-anchor="start">Verified sources</text>
  <text x="372" y="104" fill="#626a66" font-size="13" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="start">Public vehicle and ZIP data, each</text>
  <text x="372" y="124" fill="#626a66" font-size="13" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="start">answer labelled live or recorded.</text>
  <line x1="668" y1="32" x2="668" y2="136" stroke="#1a211f" stroke-width="0.8" stroke-opacity="0.16"/>
  <text x="684" y="44" fill="#56605b" font-size="8" font-weight="400" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace" text-anchor="start">03 · CONTROL</text>
  <text x="684" y="76" fill="#1a211f" font-size="20" font-weight="400" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" text-anchor="start">Human approval</text>
  <text x="684" y="104" fill="#626a66" font-size="13" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="start">Drafts need consent and a</text>
  <text x="684" y="124" fill="#626a66" font-size="13" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="start">person; nothing is sent.</text>
</svg>
